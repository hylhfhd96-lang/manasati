  --navy:#1B2A6B; --blue:#2F5BD8; --sky:#E9F1FF; --orange:#F5A01A; --purple:#8A55E8;
  --pink:#E8458B; --green:#12A27C; --red:#E5484D; --ink:#1B2A6B; --muted:#5B6A99;

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#E8EEFF; --muted:#A9B6E0; --card:#18214A; --bg:#0E1533; --line:#2A3670; --sky:#1C275A; }
}
:root[data-theme="dark"]{ --ink:#E8EEFF; --muted:#A9B6E0; --card:#18214A; --bg:#0E1533; --line:#2A3670; --sky:#1C275A; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font-family:inherit;font-size:1rem;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.app{max-width:540px;margin:0 auto;min-height:100%;position:relative;overflow-x:hidden}
.screen{display:none;min-height:100vh;min-height:100dvh;padding-bottom:28px}
.screen.on{display:block}
.screen.reveal{animation:reveal .7s cubic-bezier(.7,0,.2,1) both}
@keyframes reveal{from{clip-path:circle(0% at var(--x,50%) var(--y,50%))}to{clip-path:circle(150% at var(--x,50%) var(--y,50%))}}
.display{font-family:"Baloo Bhaijaan 2","Tajawal",sans-serif}

/* login */
.hero{width:100%;aspect-ratio:1024/560;background:var(--poster) top center/100% auto no-repeat;position:relative}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,var(--bg))}
.login{padding:0 18px}
.login h1{font-size:1.55rem;margin:4px 0 2px;text-align:center;color:var(--ink)}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 18px;font-size:.98rem}
.roles{display:grid;gap:12px}
.role{display:flex;align-items:center;gap:14px;border:0;border-radius:22px;padding:14px 16px;text-align:right;color:#fff;font-weight:800;font-size:1.12rem;box-shadow:0 6px 0 rgba(0,0,0,.14);transition:transform .12s}
.role:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.role small{display:block;font-weight:500;font-size:.85rem;opacity:.92}
.role .ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.5rem;flex:none}
.r-st{background:linear-gradient(135deg,#E8458B,#F07AAE)}
.r-te{background:linear-gradient(135deg,#7B4BE0,#A07AF0)}
.r-vi{background:linear-gradient(135deg,#1FA7C9,#2F5BD8)}
.form{display:none;background:var(--card);border-radius:22px;padding:18px;margin-top:14px;border:2px solid var(--line)}
.form.on{display:block;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.form label{display:block;font-weight:700;margin:8px 0 6px;font-size:.95rem}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--sky);outline:none}
.inp:focus{border-color:var(--blue)}

.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;font-size:.92rem;max-width:70%}
.chip .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;font-size:.95rem;flex:none}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hs{position:absolute;border:0;background:transparent;border-radius:18px;padding:0}

.badge{position:absolute;top:-4px;left:-4px;background:var(--green);color:#fff;font-size:.7rem;font-weight:800;border-radius:999px;padding:2px 7px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.counter{position:absolute;background:#fff;display:grid;place-items:center;color:var(--navy);font-weight:800;font-size:clamp(.9rem,4.4vw,1.5rem);border-radius:8px;font-family:"Baloo Bhaijaan 2",sans-serif}

/* inner pages */
.head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.back{position:relative;z-index:5;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.2rem;flex:none}

.wrap{padding:0 14px}
.panel{background:var(--card);border-radius:20px;padding:16px;border:2px solid var(--line);margin-bottom:14px}

.qhead{padding:12px 14px 0}

.qnum{font-family:"Baloo Bhaijaan 2",sans-serif;font-size:1.05rem;color:var(--purple)}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:10px 0 4px}

.dot.ok{background:var(--green)} .dot.no{background:var(--red)} .dot.cur{background:var(--orange)}
.stage{perspective:1200px;padding:10px 14px}
.qcard{background:var(--card);border-radius:24px;padding:20px 18px;border:2px solid var(--line);box-shadow:0 10px 0 var(--line);transform-origin:50% 100%}
.qcard.in{animation:qin .55s cubic-bezier(.2,.8,.2,1) both}
.qcard.out{animation:qout .35s ease-in both}
@keyframes qin{from{transform:rotateX(-70deg) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes qout{to{transform:translateX(-120%) rotate(-8deg);opacity:0}}
.qtext{font-size:1.18rem;font-weight:800;line-height:1.9;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--line);background:var(--sky);border-radius:16px;padding:12px 14px;font-weight:700;font-size:1.05rem;transition:transform .15s,background .2s,border-color .2s}

.opt .t{flex:1}
.m{font-family:"Tajawal",system-ui,sans-serif;font-weight:800;white-space:nowrap;letter-spacing:.3px}
.opts.in .opt{animation:oin .4s ease both}
.opts.in .opt:nth-child(2){animation-delay:.06s}.opts.in .opt:nth-child(3){animation-delay:.12s}.opts.in .opt:nth-child(4){animation-delay:.18s}
@keyframes oin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.opt.right{background:#D9F7EC;border-color:var(--green);color:#075b44}

.praise{text-align:center;font-weight:800;font-size:1.2rem;min-height:1.8em;margin-top:12px}

.rate{display:flex;gap:6px;direction:ltr;justify-content:flex-end;font-size:1.8rem}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(150%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;transition:transform .35s;max-width:90%;text-align:center}

.modal{position:fixed;inset:0;background:rgba(10,16,45,.6);display:none;place-items:center;z-index:70;padding:16px}
.modal.on{display:grid}
.modal .box{background:var(--card);border-radius:20px;padding:14px;max-width:520px;width:100%;text-align:center}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.gameBtn{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;width:calc(100% - 24px);margin:14px 12px 0;border:0;border-radius:24px;padding:14px 18px;text-align:right;color:#fff;background:linear-gradient(135deg,#4C8DFF,#8E5BEA);border:3.5px solid #241F4E;box-shadow:0 7px 0 #241F4E;font-family:inherit}

#gameLayer{position:fixed;inset:0;z-index:90;display:none;background:#CFE3EE}

const COLS=["logins","results","comments","opinions"];
const HAS_GAS=!!(window.google&&google.script&&google.script.run);
const Store={
  remote:{}, pending:{}, subs:[], online:false,
  init(){
    COLS.forEach(c=>{this.pending[c]=LS.get("ithraaMath_pending_"+c,[]);this.remote[c]=[]});
    this.emit();
    if(!HAS_GAS){this.setSync(false);return}
    this.refresh();setInterval(()=>this.refresh(),20000);
  },
  refresh(){
    google.script.run.withSuccessHandler(data=>{
      COLS.forEach(c=>{this.remote[c]=(data&&data[c])||[]});
      this.online=true;this.setSync(true);this.flush();this.emit();
    }).withFailureHandler(()=>this.setSync(false)).getAll();
  },
  setSync(on){const s=$("#sync");if(s)s.textContent=on?"✓ البيانات محفوظة بشكل دائم في سجل المنصة":"جارٍ الاتصال بسجل المنصة…"},
  savePending(c){LS.set("ithraaMath_pending_"+c,this.pending[c])},
  all(c){const m=new Map();this.remote[c].forEach(x=>m.set(x.id,x));this.pending[c].forEach(x=>{if(!m.has(x.id))m.set(x.id,x)});return [...m.values()].sort((a,b)=>(a.t||0)-(b.t||0))},
  send(c,doc){
    if(!HAS_GAS)return;
    google.script.run.withSuccessHandler(()=>{
      this.pending[c]=this.pending[c].filter(x=>x.id!==doc.id);this.savePending(c);
      if(!this.remote[c].some(x=>x.id===doc.id))this.remote[c].push(doc);this.emit();
    }).withFailureHandler(()=>{}).addRow(c,doc);
  },
  async add(c,obj){
    const doc={...obj,id:rid(),t:Date.now()};
    this.pending[c].push(doc);this.savePending(c);this.emit();this.send(c,doc);
    return doc;
  },
  flush(){COLS.forEach(c=>this.pending[c].forEach(d=>{if(this.remote[c].some(r=>r.id===d.id)){this.pending[c]=this.pending[c].filter(x=>x.id!==d.id);this.savePending(c)}else this.send(c,d)}))},
  on(fn){this.subs.push(fn)},
  emit(){this.subs.forEach(f=>{try{f()}catch(e){}})}
};

let AC;
function tone(seq){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8})}catch(e){}}
const sndOk=()=>tone([[660,.12,"triangle"],[880,.12,"triangle"],[1175,.22,"triangle"]]);
const sndNo=()=>tone([[300,.18,"sawtooth"],[220,.28,"sawtooth"]]);
const sndWin=()=>tone([[523,.15],[659,.15],[784,.15],[1047,.4]]);
let arVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));arVoice=v.find(x=>/female|zeina|hoda|salma|laila|amira|maryam/i.test(x.name))||v[0]||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(txt){try{if(!arVoice)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.voice=arVoice;u.lang=arVoice.lang;u.rate=1.05;u.pitch=1.3;speechSynthesis.speak(u)}catch(e){}}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(i){
  const T=TESTS[i];
  Q={test:i,i:0,score:0,ans:[],items:shuffle(T.qs).slice(0,N).map(q=>{const order=shuffle([0,1,2,3]);return {q:q.q,o:order.map(k=>q.o[k]),a:order.indexOf(q.a)}})};
  $("#qTitle").textContent="اختبار ("+ar(i+1)+") · "+T.title;
  $("#dots").innerHTML=Q.items.map(()=>'<span class="dot"></span>').join("");
  go("quiz");showQ(true);
}
function showQ(first){
  const it=Q.items[Q.i],card=$("#qcard");
  const paint=()=>{
    $("#qCount").textContent=ar(Q.i+1)+" / "+ar(N);
    document.querySelectorAll("#dots .dot").forEach((d,k)=>{d.classList.toggle("cur",k===Q.i&&!Q.ans[k])});
    $("#qtext").innerHTML=fmt(it.q);
    const O=$("#opts");O.classList.remove("in");void O.offsetWidth;
    O.innerHTML=it.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${"أبجد"[k]}</span><span class="t">${fmt(o)}</span></button>`).join("");
    O.classList.add("in");
    $("#praise").textContent="";$("#praise").className="praise";
    card.classList.remove("out","in");void card.offsetWidth;card.classList.add("in");
  };
  if(first)paint();else{card.classList.remove("in");card.classList.add("out");setTimeout(paint,330)}
}

  const b=e.target.closest(".opt");if(!b||!Q||Q.lock)return;Q.lock=true;

async function finishQuiz(){
  const s=Q.score;
  if(user.role==="student")Store.add("results",{name:user.name,cls:user.cls,test:Q.test,score:s,total:N});
  go("result");
  $("#rHead").textContent="نتيجة اختبار ("+ar(Q.test+1)+")";
  const pct=s/N;
  setTimeout(()=>{$("#ringArc").style.strokeDashoffset=452.4*(1-pct);$("#ringArc").style.stroke=pct>=.6?"var(--green)":pct>=.4?"var(--orange)":"var(--red)"},80);
  let n=0;const tt=$("#ringTxt");const iv=setInterval(()=>{tt.textContent=ar(n)+"/"+ar(N);if(n++>=s)clearInterval(iv)},55);
  const st=s>=9?3:s>=PASS_MARK?2:s>=4?1:0;
  $("#rStars").innerHTML=[0,1,2].map(i=>`<span>${i<st?"⭐":"☆"}</span>`).join("");
  $("#rTitle").textContent=s>=9?"إنجاز مذهل!":s>=PASS_MARK?"أحسنتِ، اجتزتِ الاختبار":"محاولة جيدة، أعيدي المحاولة";
  $("#rSub").textContent=s>=PASS_MARK?(user.role==="student"?"استحققتِ شهادة الإنجاز":"تجربة فقط – الشهادة للطالبات"):"تحتاجين "+ar(PASS_MARK)+" إجابة صحيحة للحصول على الشهادة";
  const btns=[];
  if(s>=PASS_MARK&&user.role==="student")btns.push('<button class="btn or" id="toCert">عرض شهادة الإنجاز 🏅</button>');
  btns.push('<button class="btn gh" id="toReview">مراجعة الإجابات</button>','<button class="btn" id="again">إعادة الاختبار</button>','<button class="btn gh" data-go="home">العودة للمنصة</button>');
  $("#rBtns").innerHTML=btns.join("");
  $("#review").hidden=true;
  if(s>=PASS_MARK){sndWin();if(user.role==="student")say("أحسنتِ! لقد استحققتِ الشهادة");confetti()}
  const tc=$("#toCert");if(tc)tc.onclick=()=>openCert();
  $("#again").onclick=()=>startQuiz(Q.test);
  $("#toReview").onclick=()=>{const R=$("#review");R.hidden=!R.hidden;R.innerHTML=Q.items.map((it,i)=>{const a=Q.ans[i];return `<div class="rv">${ar(i+1)}. <b>${fmt(it.q)}</b><br>${a.ok?`<span class="c">✓ ${fmt(it.o[it.a])}</span>`:`<span class="x">✗ ${fmt(it.o[a.k])}</span> · <span class="c">الصحيحة: ${fmt(it.o[it.a])}</span>`}</div>`}).join("");if(!R.hidden)R.scrollIntoView({behavior:"smooth"})};
}

function testAverages(R){return TESTS.map((_,i)=>{const a=R.filter(r=>r.test==i);return a.length?a.reduce((s,r)=>s+pctOf(r),0)/a.length:0})}
function barsHTML(vals,cls,labelFn){return `<div class="bars">${vals.map((v,i)=>`<div class="bar"><span>${labelFn(i)}</span><div class="track"><div class="fill ${cls||""}" data-w="${v}"></div></div><span>${ar(Math.round(v))}%</span></div>`).join("")}</div>`}
function animateBars(root){requestAnimationFrame(()=>root.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%"))}

  if(user.role==="student"){

    const rows=Object.values(per).sort((a,b)=>Object.keys(b.best).length-Object.keys(a.best).length);

/* ===================== قياس الأثر ===================== */
function renderImpact(){
  const R=Store.all("results");const first=[],last=[];const fT=TESTS.map(()=>[]),lT=TESTS.map(()=>[]);
  const g={};R.forEach(r=>{const k=r.name+"|"+r.cls+"|"+r.test;(g[k]=g[k]||[]).push(r)});
  Object.values(g).forEach(a=>{if(a.length<2)return;a.sort((x,y)=>x.t-y.t);const f=pctOf(a[0]),l=pctOf(a[a.length-1]);first.push(f);last.push(l);fT[a[0].test].push(f);lT[a[0].test].push(l)});
  const m=x=>x.length?x.reduce((s,v)=>s+v,0)/x.length:0;
  const improved=first.filter((f,i)=>last[i]>f).length;
  let h;
  if(!first.length){
    h=`<div class="panel"><div class="empty">يظهر قياس الأثر عندما تعيد الطالبات الاختبار نفسه، فنقارن المحاولة الأولى بالأخيرة لكل طالبة.</div></div>`;
  } else {
    const diff=m(last)-m(first);
    h=`<div class="kpis">
      <div class="kpi"><b>${ar(Math.round(m(first)))}%</b><span>متوسط المحاولة الأولى</span></div>
      <div class="kpi"><b>${ar(Math.round(m(last)))}%</b><span>متوسط المحاولة الأخيرة</span></div>
      <div class="kpi"><b style="color:${diff>=0?"var(--green)":"var(--red)"}">${diff>=0?"+":"−"}${ar(Math.abs(Math.round(diff)))}</b><span>نقطة مئوية تحسّن</span></div>
      <div class="kpi"><b>${ar(Math.round(improved/first.length*100))}%</b><span>من المحاولات المعادة تحسّنت</span></div>
    </div>
    <div class="panel"><h3 class="display" style="margin:0 0 4px">مدى التحسن في كل اختبار</h3>
    <div class="legend"><span><i style="background:var(--orange)"></i>المحاولة الأولى</span><span><i style="background:var(--green)"></i>المحاولة الأخيرة</span></div>
    ${TESTS.map((_,i)=>fT[i].length?`<div style="margin-bottom:10px"><div style="font-weight:800;font-size:.9rem;margin-bottom:4px">اختبار ${ar(i+1)} · ${esc(TESTS[i].title)}</div>${barsHTML([m(fT[i])],"b",()=>"قبل")}${barsHTML([m(lT[i])],"g",()=>"بعد")}</div>`:"").join("")}
    </div>`;
  }
  const B=$("#impactBody");B.innerHTML=h;animateBars(B);
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#F5A01A","#E8458B","#8A55E8","#12A27C","#2F5BD8"];
  const P=Array.from({length:120},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,r:Math.random()*6+4,c:cols[Math.random()*5|0],a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<130)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
