<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جزيرة الكنز</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: one illustrated island map → wooden signboard questions → treasure; single sunny cartoon world (deliberately one theme) */
:root{
  --sky:#cfe9f7; --sea:#9fd4ee; --wood:#9a5b2e; --wood-d:#6b3d1f; --wood-l:#c47a3e;
  --leaf:#3c9a57; --gold:#ffc531; --ink:#3a2416; --paper:#fdf6e3; --red:#e2463f; --ok:#2fa84f;
  --display:"Lalezar","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);direction:rtl;overflow-x:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;padding-block:12px 24px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:clamp(26px,6vw,40px);color:var(--wood-d);line-height:1;text-shadow:0 3px 0 #fff}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:18px;color:#fff;background:linear-gradient(var(--wood-l),var(--wood));border:3px solid var(--ink);border-radius:12px;padding:3px 12px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
/* wooden UI */
.plank{font-family:var(--display);font-size:clamp(17px,4.4vw,24px);color:#fff7e6;text-shadow:0 2px 0 rgba(0,0,0,.35);
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 3px,transparent 3px 11px),linear-gradient(180deg,var(--wood-l),var(--wood) 55%,var(--wood-d));
  border:3px solid var(--ink);border-radius:10px 14px 10px 16px;box-shadow:0 5px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.25);
  padding:12px 18px;cursor:pointer;position:relative;transition:transform .1s;min-width:0}
.plank::before,.plank::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#3a2416;opacity:.6}
.plank::before{right:8px}.plank::after{left:8px}
.plank:hover{transform:rotate(-1deg) translateY(-2px)}
.plank:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.plank:focus-visible,.stn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.plank.gold{background:linear-gradient(180deg,#ffe07a,var(--gold) 60%,#d99a12);color:var(--ink);text-shadow:none}
/* stage */
.stage{position:relative;width:100%;aspect-ratio:1000/620;border:5px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--sky);box-shadow:0 7px 0 var(--ink)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.stn{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(13px,2.6vw,22px);min-width:clamp(26px,5vw,44px);padding:2px 6px;color:#fff7e6;
  background:linear-gradient(var(--wood-l),var(--wood));border:2.5px solid var(--ink);border-radius:6px;box-shadow:0 3px 0 var(--ink);cursor:default;line-height:1.3}
.stn.done{background:linear-gradient(#6fd08a,var(--ok));}
.stn.next{cursor:pointer;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{transform:translate(-50%,-58%);box-shadow:0 0 0 6px rgba(255,197,49,.7),0 3px 0 var(--ink)}}
.hero{position:absolute;width:clamp(44px,9%,90px);z-index:3;transform:translate(-50%,-92%);transition:left 1.1s ease-in-out,top 1.1s ease-in-out;pointer-events:none;filter:drop-shadow(0 4px 2px rgba(58,36,22,.35))}
.hero.walk svg{animation:hop .28s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6%) rotate(3deg)}}
.xmark{position:absolute;left:47%;top:79%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(26px,6vw,52px);color:var(--red);text-shadow:0 3px 0 #fff;opacity:.35}
.xmark.on{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.25)}}
.sign{position:absolute;left:33%;top:73%;z-index:2;transform:translate(-50%,-50%);font-size:clamp(12px,2.4vw,20px);padding:6px 14px;cursor:default}
/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) clamp(110px,24vw,210px);gap:12px;align-items:end}
.bubble{background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:16px 18px;position:relative;box-shadow:0 5px 0 var(--ink);font-size:clamp(15px,3.6vw,19px);line-height:1.8;font-weight:700}
.bubble::after{content:"";position:absolute;left:-18px;bottom:30px;border:12px solid transparent;border-right-color:var(--ink)}
.bubble h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,5vw,34px);margin:0 0 4px;color:var(--wood-d)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
/* question board */
.board{position:relative;padding:clamp(14px,3vw,26px);border:5px solid var(--ink);border-radius:18px;box-shadow:0 7px 0 var(--ink);
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 4px,transparent 4px 34px),linear-gradient(180deg,#a8663a,#8a4f28);color:#fff7e6}
.board::before,.board::after{content:"";position:absolute;top:-28px;width:70px;height:60px;background:radial-gradient(ellipse at 50% 100%,#3c9a57 0 45%,transparent 46%),radial-gradient(ellipse at 20% 60%,#2f7d47 0 35%,transparent 36%),radial-gradient(ellipse at 80% 60%,#4fb36a 0 35%,transparent 36%);pointer-events:none}
.board::before{right:-18px}.board::after{left:-18px;transform:scaleX(-1)}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-weight:800;opacity:.95;margin-bottom:6px;font-size:14px}
.qtext{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,30px);line-height:1.6;margin:4px 0 12px;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.qimg{display:block;max-width:100%;margin:0 auto 12px;border-radius:12px;border:3px solid var(--ink);background:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts .plank{text-align:center;overflow-wrap:anywhere}
.opts .plank.ok{background:linear-gradient(#7fe39a,var(--ok));animation:pop .45s}
.opts .plank.no{background:linear-gradient(#ff8a7f,var(--red));animation:shake .4s}
.opts .plank[disabled]{cursor:default}
@keyframes pop{40%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.note{margin-top:12px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cheer{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.3);font-family:var(--display);font-size:clamp(34px,10vw,64px);color:var(--gold);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);opacity:0;pointer-events:none;z-index:30;white-space:nowrap}
.cheer.show{animation:cheer 1.1s ease-out forwards}
@keyframes cheer{15%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-4deg)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%)}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
.end{text-align:center;background:var(--paper);border:5px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);padding:18px}
.end h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,44px);color:var(--wood-d);margin:6px 0}
.end .chest{width:min(260px,70%);margin:0 auto;display:block;animation:pop 1s}
.muted{color:#6b5640;font-weight:700}
.back{align-self:center;color:var(--wood-d);font-weight:800;text-decoration:none;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 14px}
@media (max-width:560px){.opts{grid-template-columns:1fr}.intro{grid-template-columns:minmax(0,1fr) 96px}.bubble::after{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}fit();addEventListener('resize',fit);
function burst(n=70,coins=false){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const C=['#ffc531','#e2463f','#3c9a57','#8f4ea3','#43c4e0','#fff'];const s=!P.length;for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*13,vy:-Math.random()*13-3,r:Math.random()*7+5,c:coins?'#ffc531':C[i%C.length],coin:coins||i%5==0,a:Math.random()*6,l:100});if(s)requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.18;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;if(p.coin){cx.beginPath();cx.ellipse(0,0,p.r*.9,p.r*.9*Math.abs(Math.cos(p.a)),0,0,7);cx.fill();cx.strokeStyle='#b07a00';cx.lineWidth=1.5;cx.stroke()}else cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});P=P.filter(p=>p.l>0&&p.y<innerHeight+30);if(P.length)requestAnimationFrame(tick);else cx.clearRect(0,0,innerWidth,innerHeight)}
function cheer(t){const c=$('cheer');c.textContent=t;c.classList.remove('show');void c.offsetWidth;c.classList.add('show')}

function title(){
  $('view').innerHTML=`<div class="intro"><div class="bubble"><h2>أهلاً يا قبطانة!</h2>
  أنا مرجانة، ووجدت خريطة كنز قديمة 🗺️. الطريق إلى الكنز فيه <b>10 محطات</b>، وفي كل محطة لغز من أسئلة القدرات. كل إجابة صحيحة تنقلنا خطوة وتعطيك <b>10 نقاط</b>، وثلاث إجابات صحيحة متتالية تعطيك مكافأة. معك 3 قلوب، فركّزي!
  <div class="row"><button class="plank gold" id="go">⚓ ابدئي الرحلة</button></div>
  <p class="muted" style="margin:10px 0 0;font-size:14px">أفضل نتيجة لك: ${best} نقطة</p></div>
  <div>${PIRATE}</div></div>`;
  $('go').onclick=()=>{newGame();map();};
}
function map(walkFrom){
  const stations=ST.map((p,i)=>`<button class="stn ${i<G.pos?'done':''} ${i===G.pos?'next':''}" style="left:${p[0]}%;top:${p[1]}%" data-i="${i}" ${i===G.pos?'':'tabindex="-1"'} aria-label="المحطة ${i+1}">${i<G.pos?'✓':i+1}</button>`).join('');
  const pts=ST.concat([TREASURE]).map(p=>`${p[0]*10},${p[1]*6.2}`).join(' ');
  const at=walkFrom!=null?ST[walkFrom]:(G.pos<10?ST[G.pos]:TREASURE);
  $('view').innerHTML=`<div class="stage" id="stg">${ISLAND}
   <svg viewBox="0 0 1000 620" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#3a2416" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round"/></svg>
   ${G.pos>=10?'<div class="plank sign">هنا الكنز</div>':''}<div class="xmark ${G.pos>=10?'on':''}">✖</div>
   ${stations}<div class="hero" id="hero" style="left:${at[0]}%;top:${at[1]}%">${PIRATE}</div></div>
   <div class="row" style="justify-content:center">${G.pos<10?`<button class="plank gold" id="next">🧭 حلّي لغز المحطة ${G.pos+1}</button>`:`<button class="plank gold" id="dig">⛏️ احفري عن الكنز</button>`}</div>`;
  hud();
  if(walkFrom!=null){const h=$('hero');h.classList.add('walk');sStep();requestAnimationFrame(()=>requestAnimationFrame(()=>{const t=G.pos<10?ST[G.pos]:TREASURE;h.style.left=t[0]+'%';h.style.top=t[1]+'%'}));setTimeout(()=>h.classList.remove('walk'),1150)}
  document.querySelectorAll('.stn.next').forEach(b=>b.onclick=ask);
  $('next')&&($('next').onclick=ask); $('dig')&&($('dig').onclick=finale);
}
function ask(){
  if(!deck.length) deck=shuffle(BANK);
  const q=deck.pop(); G.q=q;
  $('view').innerHTML=`<div class="board"><div class="qmeta"><span>🧭 المحطة ${G.pos+1} من 10</span><span>${G.streak>=2?'🔥 '+G.streak+' متتالية':''}</span></div>
  <p class="qtext">${esc(q.q)}</p>${q.img?`<img class="qimg" src="${q.img}" alt="شكل السؤال">`:''}
  <div class="opts">${q.o.map((o,j)=>`<button class="plank" data-j="${j}">${esc(o)}</button>`).join('')}</div><div id="note"></div></div>`;
  document.querySelectorAll('.opts .plank').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
}
function answer(j){
  const q=G.q,bs=document.querySelectorAll('.opts .plank');bs.forEach(b=>b.disabled=true);bs[q.a].classList.add('ok');
  if(j===q.a){G.streak++;G.right++;const bonus=G.streak>=3?5:0;G.score+=10+bonus;sGood();burst(G.streak>=3?120:70);cheer(CHEERS[Math.random()*CHEERS.length|0]);
    $('note').innerHTML=`<div class="note"><span>✅ +10 نقاط${bonus?` و +${bonus} مكافأة 🔥`:''}، نتقدم للمحطة التالية!</span><button class="plank gold" id="nx">🚶‍♀️ امشي</button></div>`;
    $('nx').onclick=()=>{const from=G.pos;G.pos++;map(from)};}
  else{bs[j].classList.add('no');G.streak=0;G.wrong++;G.hearts--;sBad();hud();
    $('note').innerHTML=`<div class="note"><span>❌ الإجابة الصحيحة: <b>${esc(q.o[q.a])}</b><br><small>${TIPS[Math.random()*TIPS.length|0]}</small></span><button class="plank gold" id="nx">${G.hearts>0?'🔁 لغز آخر':'⚓ النتيجة'}</button></div>`;
    $('nx').onclick=()=>G.hearts>0?ask():lost();}
  $('nx').focus({preventScroll:true});
}
function lost(){
  $('view').innerHTML=`<div class="end"><div style="font-size:64px">🌊</div><h2>انتهت القلوب!</h2><p class="muted">وصلتِ للمحطة ${G.pos} من 10 وجمعتِ ${G.score} نقطة. القبطانة الشاطرة تحاول مرة ثانية!</p>
  <div class="row" style="justify-content:center"><button class="plank gold" id="again">🔁 رحلة جديدة</button></div></div>`;
  save();$('again').onclick=()=>{newGame();map()};
}
function save(){if(G.score>best){best=G.score;try{localStorage.setItem('tk-best',best)}catch(e){}}}
function finale(){
  save();sWin();burst(200,true);setTimeout(()=>burst(160),500);
  $('view').innerHTML=`<div class="end">${CHEST}<h2>وجدتِ الكنز! 🏆</h2>
  <p class="muted">أنتِ قبطانة القدرات! جمعتِ <b>${G.score}</b> نقطة بـ ${G.right} إجابة صحيحة${G.wrong?` و ${G.wrong} محاولة خاطئة`:' بدون أي خطأ 🌟'}.</p>
  <div class="row" style="justify-content:center"><button class="plank gold" id="again">🗺️ مغامرة جديدة</button></div></div>`;
  $('again').onclick=()=>{newGame();map()};
}
newGame();hud();title();
</script>

</body>
